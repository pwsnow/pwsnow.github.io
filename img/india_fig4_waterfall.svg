    <text x="75" y="444" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">−6</text>
    <line x1="90" y1="480" x2="910" y2="480" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
