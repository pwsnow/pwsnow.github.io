<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">UCLTouchRehab Commercial Pricing &amp; Value-Based Threshold Ceilings</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Health-Economic Headroom Analysis Across All Four NHS Procurement Limits</text>

  <!-- Main Chart Container -->
  <g transform="translate(180, 110)">
    <!-- Gridlines -->
    <line x1="0" y1="0" x2="0" y2="400" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="180" y1="0" x2="180" y2="400" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="180" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">£1,500</text>
    
    <line x1="360" y1="0" x2="360" y2="400" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="360" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">£3,000</text>

    <line x1="540" y1="0" x2="540" y2="400" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="540" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">£4,500</text>

    <line x1="720" y1="0" x2="720" y2="400" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="720" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">£6,000</text>

    <line x1="900" y1="0" x2="900" y2="400" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="900" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">£7,500</text>

    <!-- BAR 1: Baseline Device Price (£40.55) -->
    <text x="-15" y="45" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">Baseline Device Cost</text>
    <text x="-15" y="63" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">(Current Model Base)</text>
    <rect x="0" y="25" width="4.86" height="45" rx="6" fill="#0284c7" opacity="0.95"/>
    <text x="15" y="52" font-size="13" font-weight="800" fill="#0284c7">£40.55</text>

    <!-- BAR 2: Cost-Saving Ceiling (£776.50) -->
    <text x="-15" y="125" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">1. Cost-Saving Ceiling (CS_max)</text>
    <text x="-15" y="143" text-anchor="end" font-size="11" font-weight="500" fill="#10b981">(100% Self-Funding Offset)</text>
    <rect x="0" y="105" width="93.18" height="45" rx="6" fill="#10b981" opacity="0.95"/>
    <text x="105" y="132" font-size="13" font-weight="800" fill="#065f46">£776.50 / pt</text>

    <!-- BAR 3: CE @ £20,000/QALY Ceiling (£4,486.65) -->
    <text x="-15" y="205" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">2. CE @ £20k/QALY Ceiling</text>
    <text x="-15" y="223" text-anchor="end" font-size="11" font-weight="500" fill="#06b6d4">(NICE Conservative Appraisal)</text>
    <rect x="0" y="185" width="538.4" height="45" rx="6" fill="#06b6d4" opacity="0.95"/>
    <text x="550" y="212" font-size="13" font-weight="800" fill="#0e7490">£4,486.65 / pt</text>

    <!-- BAR 4: CE @ £25,000/QALY Ceiling (£5,414.18) -->
    <text x="-15" y="285" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">3. CE @ £25k/QALY Ceiling</text>
    <text x="-15" y="303" text-anchor="end" font-size="11" font-weight="500" fill="#6366f1">(NICE Primary Reference Case)</text>
    <rect x="0" y="265" width="649.7" height="45" rx="6" fill="#6366f1" opacity="0.95"/>
    <text x="662" y="292" font-size="13" font-weight="800" fill="#3730a3">£5,414.18 / pt</text>

    <!-- BAR 5: CE @ £35,000/QALY Ceiling (£7,269.26) -->
    <text x="-15" y="365" text-anchor="end" font-size="14" font-weight="700" fill="#1e293b">4. CE @ £35k/QALY Ceiling</text>
    <text x="-15" y="383" text-anchor="end" font-size="11" font-weight="500" fill="#f59e0b">(NICE Upper Severity Band)</text>
    <rect x="0" y="345" width="872.3" height="45" rx="6" fill="#f59e0b" opacity="0.95"/>
    <text x="885" y="372" font-size="13" font-weight="800" fill="#92400e">£7,269.26 / pt</text>

    <!-- Headroom Connector Arrow -->
    <line x1="4.86" y1="287" x2="649.7" y2="287" stroke="#4338ca" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="180" y="235" width="340" height="28" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="350" y="254" text-anchor="middle" font-size="11" font-weight="800" fill="#3730a3">Commercial Headroom = £5,373.63 per patient (133.5x)</text>
  </g>

  <!-- BOTTOM 5-ZONE THRESHOLD STRIP -->
  <g transform="translate(180, 570)">
    <text x="0" y="-15" font-size="14" font-weight="800" fill="#0f172a">Commercial Decision Zones Across Price Levels (£/patient):</text>
    
    <!-- Zone 1 -->
    <rect x="0" y="0" width="93.18" height="60" fill="#10b981" opacity="0.2" rx="4"/>
    <rect x="0" y="0" width="93.18" height="60" fill="none" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="46.59" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#065f46">ZONE 1</text>
    <text x="46.59" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Cost-Saving</text>

    <!-- Zone 2 -->
    <rect x="93.18" y="0" width="445.22" height="60" fill="#06b6d4" opacity="0.2" rx="4"/>
    <rect x="93.18" y="0" width="445.22" height="60" fill="none" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
    <text x="315.79" y="25" text-anchor="middle" font-size="11" font-weight="800" fill="#0e7490">ZONE 2: HIGHLY COST-EFFECTIVE</text>
    <text x="315.79" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#0891b2">ICER &lt; £20,000 / QALY (£776.50 to £4,486.65)</text>

    <!-- Zone 3 -->
    <rect x="538.4" y="0" width="111.3" height="60" fill="#6366f1" opacity="0.2" rx="4"/>
    <rect x="538.4" y="0" width="111.3" height="60" fill="none" stroke="#6366f1" stroke-width="1.5" rx="4"/>
    <text x="594.05" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#3730a3">ZONE 3</text>
    <text x="594.05" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">NICE £20k–£25k</text>

    <!-- Zone 4 -->
    <rect x="649.7" y="0" width="222.6" height="60" fill="#f59e0b" opacity="0.2" rx="4"/>
    <rect x="649.7" y="0" width="222.6" height="60" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
    <text x="761" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e">ZONE 4: UPPER BAND</text>
    <text x="761" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">ICER £25k–£35k (£5.4k to £7.3k)</text>

    <!-- Zone 5 -->
    <rect x="872.3" y="0" width="107.7" height="60" fill="#ef4444" opacity="0.2" rx="4"/>
    <rect x="872.3" y="0" width="107.7" height="60" fill="none" stroke="#ef4444" stroke-width="1.5" rx="4"/>
    <text x="926" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#991b1b">ZONE 5</text>
    <text x="926" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">Not CE (&gt;£7.3k)</text>

    <!-- Ticks below zone -->
    <text x="0" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">£0.00</text>
    <text x="93.18" y="80" text-anchor="middle" font-size="10" font-weight="800" fill="#10b981">£776.50</text>
    <text x="538.4" y="80" text-anchor="middle" font-size="10" font-weight="800" fill="#06b6d4">£4,486.65</text>
    <text x="649.7" y="80" text-anchor="middle" font-size="10" font-weight="800" fill="#6366f1">£5,414.18</text>
    <text x="872.3" y="80" text-anchor="middle" font-size="10" font-weight="800" fill="#f59e0b">£7,269.26</text>
  </g>
</svg>
